<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="940" height="600" fill="#FAF6EF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E2A26">minto-pyramid-principle · 工作流</text>
  <text x="40" y="62" font-size="13" fill="#8A8175">把散乱想法 → 结论先行的结构化表达（青绿=主路径，珊瑚粉=红线约束）</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2FB5BA"/>
    </marker>
  </defs>

  <!-- 输入 -->
  <rect x="30" y="100" width="170" height="96" rx="12" fill="#F3E9D2" stroke="#2E2A26" stroke-width="2"/>
  <text x="48" y="126" font-size="14" font-weight="700" fill="#2E2A26">输入</text>
  <text x="48" y="148" font-size="12" fill="#2E2A26">散乱的想法</text>
  <text x="48" y="166" font-size="12" fill="#2E2A26">一段要表达的内容</text>
  <text x="48" y="184" font-size="12" fill="#2E2A26">一个待解决的问题</text>

  <!-- 主路径箭头：输入→步骤列 -->
  <path d="M200 148 L248 148" stroke="#2FB5BA" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- 步骤列 -->
  <g font-size="13" fill="#2E2A26">
    <rect x="250" y="80"  width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="80"  width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="106" font-weight="700">① 一句话定中心论点（结论先行）</text>

    <rect x="250" y="132" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="132" width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="158" font-weight="700">② SCQA 开场：情境-冲突-问题-答案</text>

    <rect x="250" y="184" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="184" width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="210" font-weight="700">③ 搭金字塔：找 2-4 个支撑理由（MECE）</text>

    <rect x="250" y="236" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="236" width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="262" font-weight="700">④ 归逻辑：演绎 / 归纳 + 补证据</text>

    <rect x="250" y="288" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="288" width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="314" font-weight="700">⑤ 定顺序：时间 / 结构 / 程度</text>

    <rect x="250" y="340" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="340" width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="366" font-weight="700">⑥ 遇问题：R1-R2 定义 + 诊断框架 / 逻辑树</text>

    <rect x="250" y="392" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#2FB5BA" stroke-width="2"/>
    <rect x="250" y="392" width="8" height="42" rx="4" fill="#2FB5BA"/>
    <text x="270" y="418" font-weight="700">⑦ 输出：文档 / 演示 / PPT / 视觉化</text>
  </g>

  <!-- 竖向主路径 -->
  <path d="M270 122 L270 80 M270 174 L270 132 M270 226 L270 184 M270 278 L270 236 M270 330 L270 288 M270 382 L270 340 M270 434 L270 392" stroke="#2FB5BA" stroke-width="3" fill="none"/>

  <!-- 输出 -->
  <path d="M630 413 L705 265" stroke="#2FB5BA" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="720" y="220" width="190" height="92" rx="12" fill="#F3E9D2" stroke="#2E2A26" stroke-width="2"/>
  <text x="738" y="248" font-size="14" font-weight="700" fill="#2E2A26">输出</text>
  <text x="738" y="270" font-size="12" fill="#2E2A26">结构清晰、逻辑自洽的</text>
  <text x="738" y="288" font-size="12" fill="#2E2A26">沟通 / 分析产物</text>

  <!-- 约束卡 -->
  <text x="40" y="492" font-size="13" font-weight="700" fill="#C0563C">⚠ 红线约束（珊瑚粉）</text>
  <g font-size="11.5" fill="#2E2A26">
    <rect x="30"  y="504" width="212" height="74" rx="10" fill="#FBE7DC" stroke="#E8A07A" stroke-width="2"/>
    <text x="44" y="528" font-weight="700">结论先行</text>
    <text x="44" y="548" font-size="11">别把论点埋在结尾，</text>
    <text x="44" y="564" font-size="11">开口先给主张</text>

    <rect x="256" y="504" width="212" height="74" rx="10" fill="#FBE7DC" stroke="#E8A07A" stroke-width="2"/>
    <text x="270" y="528" font-weight="700">MECE 不重叠不遗漏</text>
    <text x="270" y="548" font-size="11">同层理由互斥且穷尽，</text>
    <text x="270" y="564" font-size="11">不混搭分组口径</text>

    <rect x="482" y="504" width="212" height="74" rx="10" fill="#FBE7DC" stroke="#E8A07A" stroke-width="2"/>
    <text x="496" y="528" font-weight="700">每层 2-4 项</text>
    <text x="496" y="548" font-size="11">超过就再分组，</text>
    <text x="496" y="564" font-size="11">拒绝"洗衣清单"</text>

    <rect x="708" y="504" width="202" height="74" rx="10" fill="#FBE7DC" stroke="#E8A07A" stroke-width="2"/>
    <text x="722" y="528" font-weight="700">一框一意</text>
    <text x="722" y="548" font-size="11">金字塔每格只放</text>
    <text x="722" y="564" font-size="11">一个完整想法</text>
  </g>
</svg>
